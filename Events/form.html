<!DOCTYPE html>
<head><title>Form Events</title></head>
<body>

<form 
onsubmit="onSubmit()" 
onreset="onReset()">

<input type="text" 
onfocus="onFocus()" 
onblur="onBlur()" 
onchange="onChange()" 
placeholder="Enter name">

<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

<script src="./form.js"></script>

</body>
</html>
